<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索台北 - Taipei Travel Guide</title>
    <style>
        /* 基礎全域樣式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }

        /* 1. Header 頁首樣式 */
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            color: #ecf0f1;
        }

        /* 2. Body 主體內容樣式 */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            color: #2c3e50;
        }

        /* Card 卡片容器（使用 Flexbox 佈局） */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }

        /* 單一 Card 樣式 */
        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 300px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 1.2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: #34495e;
        }

        .card-text {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .card-btn {
            display: inline-block;
            text-align: center;
            background-color: #e74c3c;
            color: #ffffff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: bold;
        }

        .card-btn:hover {
            background-color: #c0392b;
        }

        /* 3. Footer 頁尾樣式 */
        footer {
            background-color: #2c3e50;
            color: #bdc3c7;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }

        footer p {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header 頁首區域 -->
    <header>
        <h1>探索台北 Explore Taipei</h1>
        <p>感受現代繁華與傳統文化交織的魅力之都</p>
    </header>

    <!-- Main 主體內容區域 -->
    <main>
        <h2 class="section-title">熱門景點推薦</h2>

        <!-- Card 卡片展示區 -->
        <div class="card-container">
            
            <!-- Card 1 -->
            <article class="card">
                <img src="https://picsum.photos/id/1015/400/250" alt="台北101">
                <div class="card-body">
                    <h3 class="card-title">台北 101</h3>
                    <p class="card-text">台灣最具代表性的地標摩天大樓，擁有高空觀景台，可俯瞰整個台北盆地的壯麗夜景。</p>
                    <a href="#" class="card-btn">了解更多</a>
                </div>
            </article>

            <!-- Card 2 -->
            <article class="card">
                <img src="https://picsum.photos/id/1040/400/250" alt="國立故宮博物院">
                <div class="card-body">
                    <h3 class="card-title">國立故宮博物院</h3>
                    <p class="card-text">收藏了近七十萬件中華歷代珍貴文物與藝術品，是全球最著名的博物館之一。</p>
                    <a href="#" class="card-btn">了解更多</a>
                </div>
            </article>

            <!-- Card 3 -->
            <article class="card">
                <img src="https://picsum.photos/id/1060/400/250" alt="士林夜市">
                <div class="card-body">
                    <h3 class="card-title">士林夜市</h3>
                    <p class="card-text">台北規模最大的夜市之一，匯集了各式在地知名小吃如大腸包小腸、雞排與珍珠奶茶。</p>
                    <a href="#" class="card-btn">了解更多</a>
                </div>
            </article>

        </div>
    </main>

    <!-- Footer 頁尾區域 -->
    <footer>
        <p>&copy; 2026 前端網頁設計課程作業 - 台北旅遊介紹網頁</p>
    </footer>

</body>
</html>
