<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Travel - 我的購物車與預訂行程</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coral: { 50: '#F7ECEB', 100: '#E8CECD', 300: '#E2A99B', 600: '#B55353', 700: '#9A4141' },
                        teal: { 50: '#F3F7F8', 100: '#D8E4E7', 200: '#C2DCDE', 600: '#588B97', 700: '#436B75' },
                        dark: '#2C3E50',
                    },
                    fontFamily: { sans: ['Inter', 'Noto Sans TC', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-[#FAF8F5] text-dark flex flex-col min-h-screen">

    <!-- HEADER (由 auth.js 動態渲染) -->
    <div id="header-container"></div>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12 flex-grow pt-28">
        
        <!-- 頁面標題 -->
        <div class="border-b border-stone-200 pb-4 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-dark flex items-center gap-2.5">
                    <i class="fa-solid fa-cart-shopping text-coral-600"></i> 我的購物車與預訂行程
                </h1>
                <p class="text-xs text-gray-500 mt-1">查看您已預訂的團旅方案與客製化諮詢紀錄</p>
            </div>
            <div id="cart-count-display" class="text-xs font-semibold text-gray-600 bg-white px-3.5 py-1.5 rounded-full border border-stone-200 shadow-sm">
                共 0 筆紀錄
            </div>
        </div>

        <!-- 未登入提示區塊 -->
        <div id="not-logged-in" class="hidden bg-white p-12 rounded-2xl text-center shadow-sm border border-stone-200 space-y-4">
            <i class="fa-solid fa-lock text-4xl text-stone-300"></i>
            <h3 class="text-lg font-bold text-gray-700">請先登入會員</h3>
            <p class="text-xs text-gray-400">登入後即可檢視您的清單與行程紀錄</p>
            <button onclick="openAuthModal('login')" class="px-6 py-2.5 bg-coral-600 hover:bg-coral-700 text-white text-xs font-bold rounded-xl transition shadow-md cursor-pointer">
                立即登入
            </button>
        </div>

        <!-- 購物車為空提示區塊 -->
        <div id="cart-empty" class="hidden bg-white p-12 rounded-2xl text-center shadow-sm border border-stone-200 space-y-3">
            <i class="fa-solid fa-basket-shopping text-4xl text-stone-300"></i>
            <h3 class="text-lg font-bold text-gray-700">購物車目前是空的</h3>
            <p class="text-xs text-gray-400">快去探索各種熱門主題團旅與自由行方案吧！</p>
            <a href="index.html" class="inline-block mt-2 px-6 py-2.5 bg-coral-600 hover:bg-coral-700 text-white text-xs font-bold rounded-xl transition shadow-md">
                探索熱門行程
            </a>
        </div>

        <!-- 分類區塊 1：已購買/預訂之主題與自由行行程 -->
        <section id="section-purchased" class="cart-section space-y-4">
            <div class="flex items-center justify-between border-b-2 border-coral-300 pb-2">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-plane-circle-check text-coral-600 text-xl"></i>
                    <h2 class="text-xl font-bold text-dark">已預訂團旅 / 自由行</h2>
                </div>
            </div>
            <div id="grid-purchased" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>

        <!-- 分類區塊 2：已送出之客製諮詢需求 -->
        <section id="section-custom-requests" class="cart-section space-y-4">
            <div class="flex items-center justify-between border-b-2 border-teal-300 pb-2">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-clipboard-list text-teal-600 text-xl"></i>
                    <h2 class="text-xl font-bold text-dark">客製小團諮詢紀錄</h2>
                </div>
            </div>
            <div id="grid-custom-requests" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>

    </main>

    <!-- 💡 結帳信用卡與飛行日期彈跳視窗 Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[10001] flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl relative space-y-5">
            <button type="button" onclick="closePaymentModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-600 text-xl font-bold cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div>
                <span class="bg-coral-50 text-coral-600 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Fast Checkout</span>
                <h3 id="pay-modal-title" class="text-lg font-bold text-gray-800 mt-1">行程線上安全結帳</h3>
                <p id="pay-modal-price" class="text-xs font-bold text-coral-600 mt-0.5">應付總額：TWD 0</p>
            </div>

            <form onsubmit="handlePaymentSubmit(event)" class="space-y-4">
                
                <!-- 自由行專用：飛行出發日期 -->
                <div id="flight-date-container" class="hidden">
                    <label class="block text-xs font-bold text-gray-600 mb-1"><span class="text-red-500 mr-0.5">*</span>請選擇預計出發 (飛行) 日期</label>
                    <input type="date" id="flight-date-input" class="w-full px-4 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-coral-600">
                </div>

                <!-- 主題團旅專用：帶入時間顯示 -->
                <div id="theme-date-container" class="hidden p-3 bg-teal-50 border border-teal-200 rounded-xl text-xs text-teal-700">
                    <i class="fa-solid fa-calendar-check mr-1"></i><strong>團旅出發日期：</strong><span id="theme-date-display">自動帶入中...</span>
                </div>

                <!-- 虛擬信用卡填寫區 -->
                <div class="space-y-3 pt-1 border-t border-stone-100">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1"><span class="text-red-500 mr-0.5">*</span>虛擬信用卡卡號</label>
                        <input type="text" id="card-number" required maxlength="19" placeholder="4311 9527 8888 6666" class="w-full px-4 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-coral-600">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1"><span class="text-red-500 mr-0.5">*</span>有效期限</label>
                            <input type="text" id="card-expiry" required maxlength="5" placeholder="MM/YY (如: 12/28)" class="w-full px-4 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-coral-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1"><span class="text-red-500 mr-0.5">*</span>安全碼 (CVV)</label>
                            <input type="password" id="card-cvv" required maxlength="3" placeholder="123" class="w-full px-4 py-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-coral-600">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-coral-600 hover:bg-coral-700 text-white font-bold rounded-xl transition shadow-md text-sm mt-2 cursor-pointer flex items-center justify-center gap-2">
                    <i class="fa-solid fa-lock"></i> 確認安全付款並完成預訂
                </button>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-stone-200/70 border-t border-stone-300/60 mt-12 py-10">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
            © 2026 Wanderlust Travel Agency. All rights reserved.
        </div>
    </footer>

    <!-- 購物車全邏輯 -->
    <script src="auth.js"></script>
    <script>
        let currentCheckoutIndex = -1;
        let currentCheckoutItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
        });

        function renderCartPage() {
            const currentUser = localStorage.getItem('currentUser');
            const notLoggedInBox = document.getElementById('not-logged-in');
            const cartEmptyBox = document.getElementById('cart-empty');
            const sectionPurchased = document.getElementById('section-purchased');
            const sectionCustom = document.getElementById('section-custom-requests');

            const gridPurchased = document.getElementById('grid-purchased');
            const gridCustom = document.getElementById('grid-custom-requests');

            gridPurchased.innerHTML = '';
            gridCustom.innerHTML = '';

            if (!currentUser) {
                notLoggedInBox.classList.remove('hidden');
                cartEmptyBox.classList.add('hidden');
                sectionPurchased.style.display = 'none';
                sectionCustom.style.display = 'none';
                document.getElementById('cart-count-display').textContent = '共 0 筆紀錄';
                return;
            }

            notLoggedInBox.classList.add('hidden');

            const userCartKey = `user_cart_${currentUser}`;
            const cartItems = JSON.parse(localStorage.getItem(userCartKey) || '[]');

            let purchasedCount = 0;
            let customCount = 0;

            cartItems.forEach((item, index) => {
                if (item.type === 'custom_request') {
                    customCount++;
                    const remarksHTML = (item.remarks && item.remarks !== '無' && item.remarks.trim() !== '') 
                        ? `<p class="pt-2 text-stone-700 border-t border-stone-200/70 mt-1"><strong><i class="fa-regular fa-note-sticky text-coral-600 mr-1"></i>特殊要求：</strong><span class="text-coral-700 font-medium">${item.remarks}</span></p>`
                        : '';

                    gridCustom.innerHTML += `
                        <div class="bg-white/90 rounded-2xl overflow-hidden border border-stone-200/70 soft-shadow flex flex-col justify-between">
                            <div class="p-5 space-y-3">
                                <div class="flex items-center justify-between border-b pb-2">
                                    <span class="bg-teal-50 text-teal-600 text-xs font-bold px-2.5 py-0.5 rounded-full">客製諮詢</span>
                                    <span class="text-xs text-stone-400">${item.date || '近期'}</span>
                                </div>
                                <h3 class="text-base font-bold text-gray-800">${item.title}</h3>
                                <div class="text-xs text-gray-600 space-y-1 bg-stone-50 p-3 rounded-xl border border-stone-100">
                                    <p><strong>預估金額：</strong><span class="text-coral-600 font-bold">${item.price}</span></p>
                                    <p><strong>聯絡人：</strong>${item.contactName || currentUser}</p>
                                    <p><strong>出發月份：</strong>${item.travelMonth || '洽詢中'}</p>
                                    ${remarksHTML}
                                </div>
                            </div>
                            <div class="p-4 bg-stone-50 border-t border-stone-100 flex justify-between items-center">
                                <span class="text-xs text-teal-600 font-medium"><i class="fa-solid fa-clock mr-1"></i>專人處理中</span>
                                <button onclick="removeFromCart(${index})" class="text-xs text-stone-400 hover:text-red-500 font-medium transition cursor-pointer">
                                    <i class="fa-solid fa-trash-can mr-1"></i>刪除紀錄
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    purchasedCount++;
                    gridPurchased.innerHTML += `
                        <div class="bg-white/90 rounded-2xl overflow-hidden border border-stone-200/70 soft-shadow transition-all duration-300 hover:shadow-lg flex flex-col justify-between">
                            <div class="h-44 bg-stone-200 overflow-hidden relative">
                                <img src="${item.img || 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=600&q=80'}" class="w-full h-full object-cover" alt="${item.title}">
                                <span class="absolute top-3 left-3 bg-coral-600 text-white text-xs font-semibold px-2.5 py-1 rounded-full shadow-sm">${item.tag || '已預訂'}</span>
                            </div>
                            <div class="p-4 space-y-2">
                                <div class="text-xs font-semibold text-coral-600">${item.orderId ? '訂單編號: ' + item.orderId : '正式預訂'}</div>
                                <h3 class="text-sm font-bold text-gray-800">${item.title}</h3>
                                <div class="flex items-center justify-between pt-2 border-t border-stone-100">
                                    <span class="text-xs text-stone-400">總金額</span>
                                    <div class="text-right text-coral-600 font-bold text-xl">${item.price}</div>
                                </div>
                            </div>
                            <div class="p-3 bg-stone-50 border-t border-stone-100 flex justify-between items-center gap-2">
                                <button onclick="removeFromCart(${index})" class="text-xs text-stone-400 hover:text-red-500 font-medium transition cursor-pointer">
                                    <i class="fa-solid fa-trash-can mr-1"></i>取消預訂
                                </button>
                                <button onclick="openPaymentModal(${index})" class="px-4 py-2 bg-coral-600 hover:bg-coral-700 text-white font-bold text-xs rounded-xl shadow transition cursor-pointer flex items-center gap-1.5">
                                    <i class="fa-solid fa-credit-card"></i>立即結帳
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            const total = purchasedCount + customCount;
            document.getElementById('cart-count-display').textContent = `共 ${total} 筆紀錄`;

            if (total === 0) {
                cartEmptyBox.classList.remove('hidden');
                sectionPurchased.style.display = 'none';
                sectionCustom.style.display = 'none';
            } else {
                cartEmptyBox.classList.add('hidden');
                sectionPurchased.style.display = purchasedCount > 0 ? 'block' : 'none';
                sectionCustom.style.display = customCustomCount > 0 ? 'block' : 'none';
                sectionCustom.style.display = customCount > 0 ? 'block' : 'none';
            }

            if (typeof window.updateCartBadge === 'function') {
                window.updateCartBadge();
            }
        }

        function removeFromCart(index) {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) return;

            if (confirm("確定要刪除這筆行程紀錄嗎？")) {
                const userCartKey = `user_cart_${currentUser}`;
                let cartItems = JSON.parse(localStorage.getItem(userCartKey) || '[]');
                cartItems.splice(index, 1);
                localStorage.setItem(userCartKey, JSON.stringify(cartItems));
                renderCartPage();
            }
        }

        // 💡 開啟結帳 Modal (彈跳視窗)
        function openPaymentModal(index) {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) return;

            const userCartKey = `user_cart_${currentUser}`;
            const cartItems = JSON.parse(localStorage.getItem(userCartKey) || '[]');
            currentCheckoutItem = cartItems[index];
            currentCheckoutIndex = index;

            if (!currentCheckoutItem) return;

            document.getElementById('pay-modal-title').textContent = currentCheckoutItem.title || '行程結帳';
            document.getElementById('pay-modal-price').textContent = `應付總額：${currentCheckoutItem.price || 'TWD 0'}`;

            const flightContainer = document.getElementById('flight-date-container');
            const themeContainer = document.getElementById('theme-date-container');
            const flightInput = document.getElementById('flight-date-input');

            // 自由行行程才需要手動選擇飛行日期
            if (currentCheckoutItem.type === 'free' || (currentCheckoutItem.tag && currentCheckoutItem.tag.includes('自由行'))) {
                flightContainer.classList.remove('hidden');
                themeContainer.classList.add('hidden');
                flightInput.required = true;
                flightInput.value = new Date().toISOString().split('T')[0];
            } else {
                // 主題團旅自動帶入預訂梯次時間
                flightContainer.classList.add('hidden');
                themeContainer.classList.remove('hidden');
                flightInput.required = false;
                document.getElementById('theme-date-display').textContent = currentCheckoutItem.travelDate || currentCheckoutItem.date || '2026-05-15 (已指定梯次)';
            }

            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').style.display = 'none';
        }

        // 💡 完成付款全邏輯 (連動寫入 journal.html 並自動跳轉)
        function handlePaymentSubmit(event) {
            event.preventDefault();
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser || !currentCheckoutItem) return;

            let finalTravelDate = '';
            if (currentCheckoutItem.type === 'free' || (currentCheckoutItem.tag && currentCheckoutItem.tag.includes('自由行'))) {
                finalTravelDate = document.getElementById('flight-date-input').value;
            } else {
                finalTravelDate = currentCheckoutItem.travelDate || currentCheckoutItem.date || '2026-05-15';
            }

            // 1. 將該筆行程寫入 `completed_activities_${currentUser}` 快取 (連動至 journal.html)
            const completedKey = `completed_activities_${currentUser}`;
            let completedList = JSON.parse(localStorage.getItem(completedKey) || '[]');

            completedList.push({
                id: 'act-' + Date.now(),
                title: currentCheckoutItem.title,
                date: finalTravelDate,
                img: currentCheckoutItem.img || 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=600&q=80',
                price: currentCheckoutItem.price || 'TWD 0',
                reviewed: false
            });

            localStorage.setItem(completedKey, JSON.stringify(completedList));

            // 2. 從購物車中移除該筆已付款項目
            const userCartKey = `user_cart_${currentUser}`;
            let cartItems = JSON.parse(localStorage.getItem(userCartKey) || '[]');
            cartItems.splice(currentCheckoutIndex, 1);
            localStorage.setItem(userCartKey, JSON.stringify(cartItems));

            closePaymentModal();

            // 3. 跳出確認付款彈跳視窗並跳轉
            alert(`🎉 付款成功！\n已成功扣款並完成行程【${currentCheckoutItem.title}】的預訂。\n將帶您前往「旅行日誌」檢視您的行程足跡與評價獎勵！`);
            window.location.href = 'journal.html';
        }
    </script>
</body>

</html>
